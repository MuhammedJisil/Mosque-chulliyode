<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="domeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="40%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#f3ede2"/>
    </linearGradient>
    <linearGradient id="doorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#022c22" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle App Icon Background -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>

  <!-- Subtle Inner Ring Highlight -->
  <rect x="12" y="12" width="488" height="488" rx="108" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="4"/>

  <!-- Mosque Group with Shadow -->
  <g filter="url(#shadow)">
    <!-- Minaret (Left) -->
    <!-- Minaret Base & Tower -->
    <rect x="145" y="220" width="34" height="150" rx="3" fill="url(#wallGrad)"/>
    <!-- Minaret Balcony -->
    <rect x="139" y="215" width="46" height="12" rx="3" fill="#ea580c"/>
    <rect x="142" y="200" width="40" height="15" fill="url(#wallGrad)"/>
    <!-- Minaret Spire Cone -->
    <path d="M162 135 L144 200 L180 200 Z" fill="url(#domeGrad)"/>
    <circle cx="162" cy="130" r="5" fill="#fef08a"/>
    <path d="M162 118 L162 130" stroke="#fef08a" stroke-width="3"/>
    <!-- Minaret windows -->
    <rect x="157" y="250" width="10" height="20" rx="5" fill="url(#doorGrad)"/>
    <rect x="157" y="295" width="10" height="20" rx="5" fill="url(#doorGrad)"/>

    <!-- Main Mosque Building Body -->
    <rect x="200" y="245" width="180" height="125" rx="4" fill="url(#wallGrad)"/>

    <!-- Building Top Cornice -->
    <rect x="195" y="240" width="190" height="10" rx="2" fill="#ea580c"/>

    <!-- Central Grand Dome -->
    <!-- Dome Base -->
    <path d="M210 240 C210 160, 240 140, 290 140 C340 140, 370 160, 370 240 Z" fill="url(#domeGrad)"/>
    <!-- Crescent Finial on Dome -->
    <path d="M290 120 L290 140" stroke="#fef08a" stroke-width="4" stroke-linecap="round"/>
    <circle cx="290" cy="115" r="7" fill="#fef08a"/>
    <path d="M290 102 C285 106 285 116 290 120 C287 118 285 113 287 108 C288 105 290 102 290 102 Z" fill="#fef08a"/>

    <!-- Main Arch Door -->
    <path d="M265 370 L265 295 C265 275, 315 275, 315 295 L315 370 Z" fill="url(#doorGrad)"/>
    <path d="M270 370 L270 300 C270 283, 310 283, 310 300 L310 370 Z" fill="#291205" opacity="0.3"/>

    <!-- Side Arched Windows -->
    <path d="M220 340 L220 305 C220 292, 245 292, 245 305 L245 340 Z" fill="url(#doorGrad)"/>
    <path d="M335 340 L335 305 C335 292, 360 292, 360 305 L360 340 Z" fill="url(#doorGrad)"/>

    <!-- Mosque Base Foundation Steps -->
    <rect x="130" y="370" width="265" height="14" rx="3" fill="#e2d8c3"/>
    <rect x="120" y="384" width="285" height="12" rx="3" fill="#cfc2a7"/>
  </g>
</svg>
